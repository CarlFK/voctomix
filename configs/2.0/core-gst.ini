[mix]
sources = Test1,Test2

[source.Test1]
kind=gst
video_source=videotestsrc pattern=blue
audio.original=0+1

[source.Test2]
kind=gst
video_source=videotestsrc pattern=ball motion=sweep
audio_source=audiotestsrc

[previews]
; enable previews so we can see something in VOC2GUI
# enabled = false

; enable live preview so we can see the blinder working
# live = false

videocaps=video/x-raw,width=1024,height=576,framerate=25/1

[composites]
; fullscreen source B is full transparent
FULL.alpha-b            = 0

[transitions]
; unique name           =  ms, from / [... /] to
FADE                    = 750, FULL / FULL
